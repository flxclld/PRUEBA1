<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-label="Premium interior with large-format canvas artwork">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e7"/>
      <stop offset="0.58" stop-color="#e5dbc9"/>
      <stop offset="1" stop-color="#cbb89b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8a184"/>
      <stop offset="1" stop-color="#7a6654"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8efe1"/>
      <stop offset="0.45" stop-color="#c99b6f"/>
      <stop offset="1" stop-color="#2f3431"/>
    </linearGradient>
    <filter id="grain">
