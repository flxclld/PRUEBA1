name: Deploy Tulum Sostenible redesign

on:
  push:
    branches:
      - main
    paths:
      - tulum-sostenible-redesign/**
      - .github/workflows/tulum-sostenible-redesign-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tulum-sostenible-redesign-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tulum-sostenible-redesign

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
