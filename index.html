<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GranFormato | Arte en gran formato para transformar espacios</title>
    <meta
      name="description"
      content="Arte en gran formato, visualizacion AI, asesoria curatorial e instalacion profesional para hogares, hoteles, restaurantes y espacios arquitectonicos."
    >
    <link rel="preload" href="assets/granformato-hero.png" as="image">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header" data-header>
      <a class="brand" href="#home" aria-label="GranFormato inicio">
        <span>Gran</span>Formato
      </a>
      <nav class="nav" aria-label="Navegacion principal">
        <a href="#gallery">Obras</a>
        <a href="#services">Servicios</a>
        <a href="#studio">Estudio</a>
        <a href="#contact">Cotizar</a>
      </nav>
      <button class="icon-button" type="button" data-open-visualizer aria-label="Abrir visualizador AI">
        AI
      </button>
    </header>

    <main id="app"></main>

    <div class="modal" data-visualizer-modal aria-hidden="true">
      <div class="modal__backdrop" data-close-modal></div>
      <section class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="visualizer-title">
        <div class="modal__header">
          <div>
            <p class="eyebrow">Visualizacion AI</p>
            <h2 id="visualizer-title">Ver la obra en tu propio espacio.</h2>
          </div>
          <button class="icon-button" type="button" data-close-modal aria-label="Cerrar visualizador">x</button>
        </div>
        <form class="visualizer" data-visualizer-form>
          <label class="upload-zone">
            <input type="file" accept="image/*" data-room-upload>
            <span>Sube una foto de tu sala, lobby o restaurante</span>
            <small>JPG o PNG. En este prototipo se genera una vista simulada.</small>
          </label>

          <div class="form-grid">
            <label>
              Obra
              <select data-visualizer-artwork></select>
            </label>
            <label>
              Tamano aproximado
              <select data-visualizer-size></select>
            </label>
            <label>
              Posicion en muro
              <select data-visualizer-position>
                <option value="center">Centro del muro</option>
                <option value="left">Lado izquierdo</option>
                <option value="right">Lado derecho</option>
                <option value="low">Sobre mobiliario bajo</option>
              </select>
            </label>
          </div>

          <button class="button button--dark" type="submit">Generar visualizacion</button>
        </form>

        <div class="mockup" data-visualizer-preview>
          <div class="mockup__room">
            <div class="mockup__art" data-preview-art></div>
            <div class="mockup__sofa"></div>
          </div>
          <p>Preview conceptual listo para conectar con una API de generacion de imagen.</p>
        </div>
      </section>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
